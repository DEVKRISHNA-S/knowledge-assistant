version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: ka_postgres
    environment:
      POSTGRES_USER: ka_user
      POSTGRES_PASSWORD: ka_password
      POSTGRES_DB: knowledge_assistant
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: ka_qdrant
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  pg_data:
  qdrant_data:

# Ollama is intentionally NOT containerized here.
# Install it natively (ollama.com) so it can use your GPU/CPU directly
# without Docker's virtualization overhead. Run: ollama pull llama3.1:8b